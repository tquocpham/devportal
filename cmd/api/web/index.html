<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Codebase Assistant</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --border: #e0e0e0;
    --accent: #2f6fed;
    --bubble-user: #eef3ff;
    --bubble-assistant: #f5f5f5;
    --code-bg: #f0f0f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #eaeaea;
      --muted: #9a9a9a;
      --border: #2c2f36;
      --accent: #6d9bff;
      --bubble-user: #24304a;
      --bubble-assistant: #232529;
      --code-bg: #1d1f24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  #login-view {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
  }
  #login-view a {
    background: var(--accent);
    color: white;
    text-decoration: none;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  #chat-view {
    flex: 1;
    display: none;
    flex-direction: column;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
    padding: 1rem 1.5rem;
    overflow: hidden;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding-bottom: 1rem;
  }
  .msg {
    padding: 0.6rem 0.9rem;
    border-radius: 10px;
    max-width: 85%;
    white-space: pre-wrap;
    line-height: 1.45;
    font-size: 0.95rem;
  }
  .msg.user { align-self: flex-end; background: var(--bubble-user); }
  .msg.assistant { align-self: flex-start; background: var(--bubble-assistant); }
  .msg.error { align-self: flex-start; background: #fde2e2; color: #7a1a1a; }
  .msg code, .msg pre {
    background: var(--code-bg);
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.85em;
  }
  .msg pre { padding: 0.6rem; overflow-x: auto; }
  .citations {
    margin-top: 0.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }
  .citation {
    font-size: 0.75rem;
    color: var(--muted);
    background: var(--code-bg);
    border-radius: 4px;
    padding: 0.15rem 0.4rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  form {
    display: flex;
    gap: 0.5rem;
    border-top: 1px solid var(--border);
    padding-top: 0.75rem;
  }
  textarea {
    flex: 1;
    resize: none;
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    font-family: inherit;
    font-size: 0.95rem;
  }
  button {
    padding: 0 1.2rem;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1>Codebase Assistant</h1>
  <span id="status"></span>
</header>

<div id="login-view">
  <p>Log in with your GitHub account to ask questions about the codebase.</p>
  <a href="/auth/github">Log in with GitHub</a>
</div>

<div id="chat-view">
  <div id="messages"></div>
  <form id="chat-form">
    <textarea id="input" rows="2" placeholder="Ask about the codebase…"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
(function () {
  var history = []; // {role, content} — trimmed client-side, server trims again as a floor
  var MAX_HISTORY = 6;

  var loginView = document.getElementById("login-view");
  var chatView = document.getElementById("chat-view");
  var messagesEl = document.getElementById("messages");
  var form = document.getElementById("chat-form");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var statusEl = document.getElementById("status");

  function escapeHtml(s) {
    var div = document.createElement("div");
    div.textContent = s;
    return div.innerHTML;
  }

  function addMessage(role, text, citations) {
    var el = document.createElement("div");
    el.className = "msg " + role;
    el.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");

    if (citations && citations.length) {
      var cWrap = document.createElement("div");
      cWrap.className = "citations";
      citations.forEach(function (c) {
        var tag = document.createElement("span");
        tag.className = "citation";
        tag.textContent = c.file + ":" + c.startLine + "-" + c.endLine;
        cWrap.appendChild(tag);
      });
      el.appendChild(cWrap);
    }

    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var message = input.value.trim();
    if (!message) return;

    addMessage("user", message);
    input.value = "";
    sendBtn.disabled = true;
    statusEl.textContent = "Thinking…";

    fetch("/api/chat", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: message, history: history }),
    })
      .then(function (res) {
        if (!res.ok) throw new Error("Request failed (" + res.status + ")");
        return res.json();
      })
      .then(function (data) {
        addMessage("assistant", data.answer, data.citations);
        history.push({ role: "user", content: message });
        history.push({ role: "assistant", content: data.answer });
        if (history.length > MAX_HISTORY) {
          history = history.slice(history.length - MAX_HISTORY);
        }
      })
      .catch(function (err) {
        addMessage("error", "Something went wrong: " + err.message);
      })
      .finally(function () {
        sendBtn.disabled = false;
        statusEl.textContent = "";
        input.focus();
      });
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  // Check session on load.
  fetch("/api/me", { credentials: "include" })
    .then(function (res) {
      if (!res.ok) throw new Error("not logged in");
      return res.json();
    })
    .then(function (me) {
      loginView.style.display = "none";
      chatView.style.display = "flex";
      statusEl.textContent = me.username ? "Logged in as " + me.username : "";
      input.focus();
    })
    .catch(function () {
      loginView.style.display = "flex";
      chatView.style.display = "none";
    });
})();
</script>

</body>
</html>
