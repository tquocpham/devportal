services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devportal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: indexer
    ports:
      # Host port 5433 -> container 5432, since 5432 is already in use
      # locally by another project's Postgres container.
      - "5433:5432"
    volumes:
      - devportal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d indexer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devportal-postgres-data:
