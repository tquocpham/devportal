services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devportal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: indexer
    ports:
      # Host port 5433 -> container 5432, since 5432 is already in use
      # locally by another project's Postgres container.
      - "5433:5432"
    volumes:
      - devportal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d indexer"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: cmd/api/Dockerfile
    container_name: devportal-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Real secrets never baked into the image. Same file you already
      # use for `go run .` locally; see cmd/api/config.local.example.yaml.
      # database_url in this file must point at "postgres" (the service
      # name below), not "localhost" containers reach each other by
      # service name on the compose network, not host ports.
      - ./cmd/api/config.local.yaml:/app/config.local.yaml:ro

volumes:
  devportal-postgres-data:
